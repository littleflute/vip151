<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多功能音乐播放器 v1.2.11</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden; /* 防止水平滚动 */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            position: relative;
        }

        .version-badge {
            position: absolute;
            top: 10px;
            right: 0;
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            word-break: break-word; /* 防止长单词溢出 */
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .version-info {
            font-size: 0.9rem;
            color: #8a9ba8;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        /* 左侧歌曲列表 */
        .playlist-section {
            flex: 1;
            min-width: 300px;
            background: rgba(30, 40, 50, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 100%; /* 防止溢出 */
        }

        .playlist-section h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4facfe;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .song-count {
            font-size: 0.9rem;
            background: #4facfe;
            color: #0f2027;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 5px;
        }

        .search-box {
            width: 100%;
            padding: 12px 18px;
            margin-bottom: 20px;
            background: rgba(20, 30, 40, 0.8);
            border: 1px solid #3a506b;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .search-box:focus {
            border-color: #4facfe;
        }

        .songs-container {
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 10px;
            -webkit-overflow-scrolling: touch; /* 移动端平滑滚动 */
        }

        .song-list {
            list-style: none;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            background: rgba(40, 55, 70, 0.6);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            overflow: hidden; /* 防止内容溢出 */
        }

        .song-item:hover {
            background: rgba(60, 80, 100, 0.8);
            transform: translateX(5px);
        }

        .song-item.playing {
            background: rgba(79, 172, 254, 0.2);
            border-left: 4px solid #4facfe;
        }

        .song-number {
            width: 30px;
            min-width: 30px; /* 固定宽度 */
            font-weight: bold;
            color: #8fbbd9;
            text-align: center;
        }

        .song-info {
            flex: 1;
            min-width: 0; /* 允许内容收缩 */
            overflow: hidden; /* 防止文本溢出 */
        }

        .song-title {
            font-weight: 600;
            font-size: 1.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .song-artist {
            font-size: 0.9rem;
            color: #a0c4e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-size {
            font-size: 0.85rem;
            color: #8a9ba8;
            margin-left: 15px;
            white-space: nowrap;
        }

        /* 右侧播放器控制 */
        .player-section {
            flex: 1.2;
            min-width: 350px;
            background: rgba(30, 40, 50, 0.7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            max-width: 100%; /* 防止溢出 */
        }

        .current-song-info {
            text-align: center;
            margin-bottom: 30px;
            overflow: hidden; /* 防止溢出 */
        }

        .current-song-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%; /* 限制最大宽度 */
        }

        .current-song-artist {
            font-size: 1.2rem;
            color: #a0c4e0;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%; /* 限制最大宽度 */
        }

        .song-progress {
            width: 100%;
            margin: 25px 0 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            overflow: hidden;
            margin-bottom: 8px;
            touch-action: none; /* 防止触摸滚动干扰 */
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #8a9ba8;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
        }

        .control-btn {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 1.8rem;
            cursor: pointer;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }

        .control-btn.play-pause {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0f2027;
            font-size: 2rem;
            width: 70px;
            height: 70px;
        }

        .control-btn.play-pause:hover {
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.7);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .volume-icon {
            font-size: 1.5rem;
            color: #a0c4e0;
            min-width: 24px; /* 固定图标宽度 */
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            touch-action: none; /* 防止触摸滚动干扰 */
        }

        .volume-fill {
            height: 100%;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            width: 70%;
            border-radius: 3px;
        }

        .volume-value {
            width: 40px;
            text-align: center;
            font-size: 0.9rem;
            min-width: 40px; /* 固定宽度 */
        }

        /* 底部状态栏 */
        .player-status {
            margin-top: auto;
            padding: 15px;
            background: rgba(20, 30, 40, 0.8);
            border-radius: 12px;
            text-align: center;
            font-size: 0.95rem;
            color: #a0c4e0;
            overflow-wrap: break-word; /* 允许长单词换行 */
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(20, 30, 40, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #4facfe;
            border-radius: 4px;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            body {

                gap: 15px;
            }
            
            h1 {
                font-size: 2.2rem;
                padding: 0 10px;

                top: 0;
                display: inline-block;
                margin-bottom: 10px;
            }
            
            .playlist-section,

                padding: 20px;
                min-width: 100%; /* 确保在移动端占满宽度 */
                width: 100%;
            }
            
            .main-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .control-btn.play-pause {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            
            .current-song-title {
                font-size: 1.6rem;
            }
            
            .current-song-artist {
                font-size: 1rem;
            }
            
            .song-item {
                padding: 12px;
                margin-bottom: 8px;
            }
            
            .song-size {
                font-size: 0.75rem;
                margin-left: 8px;
            }
        }
        
        /* 小屏幕手机优化 */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .playlist-section h2 {
                font-size: 1.4rem;
                flex-direction: column;
                align-items: flex-start;
            }
            
            .song-count {
                align-self: flex-end;
                margin-top: 10px;
            }
            
            .controls {
                gap: 15px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
            
            .control-btn.play-pause {
                width: 55px;
                height: 55px;
                font-size: 1.5rem;
            }
        }
        
        /* 防止文本选择 */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>

                <div class="songs-container">

                <div class="song-progress">
                    <div class="progress-bar" id="progressBar">

                    </div>
                    <div class="time-info">

                        <span id="durationTime">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="control-btn prev-btn" id="prevBtn" title="上一首">⏮️</button>
                    <button class="control-btn play-pause" id="playPauseBtn" title="播放/暂停">▶️</button>
                    <button class="control-btn next-btn" id="nextBtn" title="下一首">⏭️</button>
                </div>

                <div class="volume-container">
                    <div class="volume-icon">🔈</div>
                    <div class="volume-slider" id="volumeSlider">
                        <div class="volume-fill" id="volumeFill"></div>
                    </div>
                    <div class="volume-value" id="volumeValue">70%</div>
                </div>

                <div class="player-status">
                    状态: <span id="playerStatus">已停止</span> | 音量: <span id="volumeText">70%</span>
                </div>
            </section>
        </div>
    </div>

        // 页面元素
        const audioPlayer = document.getElementById('audioPlayer');
        const songListElement = document.getElementById('songList');
        const currentSongTitle = document.getElementById('currentSongTitle');
        const currentSongArtist = document.getElementById('currentSongArtist');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeElement = document.getElementById('currentTime');
        const durationTimeElement = document.getElementById('durationTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeFill = document.getElementById('volumeFill');
        const volumeValue = document.getElementById('volumeValue');
        const playerStatus = document.getElementById('playerStatus');
        const searchInput = document.getElementById('searchInput');
        const volumeText = document.getElementById('volumeText');

        // 播放器状态
        let currentSongIndex = 0;
        let isPlaying = false;
        let filteredSongs = [...mp3Files];

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            else return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // 解析歌曲信息
        function parseSongInfo(songName) {
            const match = songName.match(/^(\d+)\.(.+)-(.+)/);
            if (match) {
                return {
                    number: match[1],
                    title: match[2].trim(),
                    artist: match[3].trim()
                };
            }
            return {
                number: '',
                title: songName,
                artist: '未知歌手'
            };
        }

        // 渲染歌曲列表
        function renderSongList() {
            songListElement.innerHTML = '';
            filteredSongs.forEach((song, index) => {
                const songInfo = parseSongInfo(song.name);
                const li = document.createElement('li');
                li.className = 'song-item';
                if (index === currentSongIndex) {
                    li.classList.add('playing');
                }
                
                li.innerHTML = `
                    <div class="song-number">${songInfo.number}</div>
                    <div class="song-info">
                        <div class="song-title">${songInfo.title}</div>
                        <div class="song-artist">${songInfo.artist}</div>
                    </div>
                    <div class="song-size">${formatFileSize(song.size)}</div>
                `;
                
                li.addEventListener('click', () => {
                    playSong(index);
                });
                
                li.addEventListener('dblclick', () => {
                    if (index === currentSongIndex) {
                        togglePlayPause();
                    } else {
                        playSong(index);
                    }
                });
                
                songListElement.appendChild(li);
            });
        }

        // 播放歌曲
        function playSong(index) {
            if (index < 0 || index >= filteredSongs.length) return;
            
            currentSongIndex = index;
            const song = filteredSongs[currentSongIndex];
            const songInfo = parseSongInfo(song.name);
            
            audioPlayer.src = song.file;
            currentSongTitle.textContent = songInfo.title;
            currentSongArtist.textContent = songInfo.artist;
            
            audioPlayer.play();
            isPlaying = true;
            playPauseBtn.textContent = '⏸️';
            playerStatus.textContent = '播放中';
            
            renderSongList();
            
            audioPlayer.onloadedmetadata = () => {
                durationTimeElement.textContent = formatTime(audioPlayer.duration);
            };
        }

        // 切换播放/暂停
        function togglePlayPause() {
            if (audioPlayer.src) {
                if (isPlaying) {
                    audioPlayer.pause();
                    playPauseBtn.textContent = '▶️';
                    playerStatus.textContent = '已暂停';
                } else {
                    audioPlayer.play();
                    playPauseBtn.textContent = '⏸️';
                    playerStatus.textContent = '播放中';
                }
                isPlaying = !isPlaying;
            } else if (filteredSongs.length > 0) {
                playSong(0);
            }
        }

        // 播放下一首
        function playNext() {
            if (filteredSongs.length === 0) return;
            
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= filteredSongs.length) {
                nextIndex = 0;
            }
            playSong(nextIndex);
        }

        // 播放上一首
        function playPrev() {
            if (filteredSongs.length === 0) return;
            
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) {
                prevIndex = filteredSongs.length - 1;
            }
            playSong(prevIndex);
        }

        // 更新进度条
        function updateProgress() {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = `${progress}%`;
                currentTimeElement.textContent = formatTime(audioPlayer.currentTime);
            }
        }

        // 跳转进度
        function seekProgress(event) {
            if (!audioPlayer.duration) return;
            
            const progressBarRect = progressBar.getBoundingClientRect();
            const clickPosition = event.clientX - progressBarRect.left;
            const progressBarWidth = progressBarRect.width;
            const seekTime = (clickPosition / progressBarWidth) * audioPlayer.duration;
            
            audioPlayer.currentTime = seekTime;
        }

        // 更新音量
        function updateVolume(event) {
            const volumeSliderRect = volumeSlider.getBoundingClientRect();
            const clickPosition = event.clientX - volumeSliderRect.left;
            const sliderWidth = volumeSliderRect.width;
            let volume = clickPosition / sliderWidth;
            
            volume = Math.max(0, Math.min(1, volume));
            audioPlayer.volume = volume;
            volumeFill.style.width = `${volume * 100}%`;
            volumeValue.textContent = `${Math.round(volume * 100)}%`;
            volumeText.textContent = `${Math.round(volume * 100)}%`;
        }

        // 搜索歌曲
        function searchSongs() {
            const searchTerm = searchInput.value.toLowerCase();
            if (searchTerm.trim() === '') {
                filteredSongs = [...mp3Files];
            } else {
                filteredSongs = mp3Files.filter(song => 
                    song.name.toLowerCase().includes(searchTerm)
                );
            }
            
            // 重置当前歌曲索引
            currentSongIndex = 0;
            renderSongList();
            
            // 更新歌曲计数
            document.getElementById('songCount').textContent = `${filteredSongs.length} 首`;
        }

        // 初始化事件监听器
        function initEventListeners() {
            playPauseBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', playPrev);
            nextBtn.addEventListener('click', playNext);
            
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('ended', playNext);
            
            progressBar.addEventListener('click', seekProgress);
            volumeSlider.addEventListener('click', updateVolume);
            
            searchInput.addEventListener('input', searchSongs);
            
            // 键盘快捷键支持
            document.addEventListener('keydown', (event) => {
                switch(event.code) {
                    case 'Space':
                        event.preventDefault();
                        togglePlayPause();
                        break;
                    case 'ArrowRight':
                        playNext();
                        break;
                    case 'ArrowLeft':
                        playPrev();
                        break;
                }
            });
            
            // 初始化音量
            audioPlayer.volume = 0.7;
            volumeFill.style.width = '70%';
            
            // 触摸事件支持 - 移动端优化
            let isTouchingProgress = false;
            let isTouchingVolume = false;
            
            progressBar.addEventListener('touchstart', (e) => {
                isTouchingProgress = true;
                e.preventDefault();
                const touch = e.touches[0];
                const fakeEvent = { clientX: touch.clientX };
                seekProgress(fakeEvent);
            });
            
            progressBar.addEventListener('touchmove', (e) => {
                if (isTouchingProgress) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const fakeEvent = { clientX: touch.clientX };
                    seekProgress(fakeEvent);
                }
            });
            
            progressBar.addEventListener('touchend', () => {
                isTouchingProgress = false;
            });
            
            volumeSlider.addEventListener('touchstart', (e) => {
                isTouchingVolume = true;
                e.preventDefault();
                const touch = e.touches[0];
                const fakeEvent = { clientX: touch.clientX };
                updateVolume(fakeEvent);
            });
            
            volumeSlider.addEventListener('touchmove', (e) => {
                if (isTouchingVolume) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const fakeEvent = { clientX: touch.clientX };
                    updateVolume(fakeEvent);
                }
            });
            
            volumeSlider.addEventListener('touchend', () => {
                isTouchingVolume = false;
            });
            
            // 防止双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (event) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderSongList();
            initEventListeners();
            
            // 显示歌曲总数
            document.getElementById('songCount').textContent = `${filteredSongs.length} 首`;
            
            // 自动播放第一首歌曲
            if (filteredSongs.length > 0) {
                const firstSong = parseSongInfo(filteredSongs[0].name);
                currentSongTitle.textContent = firstSong.title;
                currentSongArtist.textContent = firstSong.artist;
            }
            
            // 版本信息
            console.log('多功能音乐播放器 v1.2.11 已加载');
            console.log('歌曲总数:', mp3Files.length);
        });
    </script>
</body>
</html>
